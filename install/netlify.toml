[build]
  publish = "."

# Serve health as plain text
[[headers]]
  for = "/health"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "no-cache"

# No redirects — all files served as-is
# docker-compose.yml and .env.example must be
# directly accessible at their paths
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store"
