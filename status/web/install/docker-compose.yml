# TurtleShell.ai Off-Grid Fleet Manifest
# Version: 1.8.0
# CloudPremise LLC — brain/1.7.x.x
# Pulled by odysseus.sh at install/update time
# Hosted at: turtleshell.ai/install/docker-compose.yml
#
# Architecture: Single Pantheon container (same image as AWS ECS)
# + TurtleShell Off-Grid dashboard

networks:
  olympus-internal:
    driver: bridge

volumes:
  turtleshell-data:
    driver: local

services:

  # ── PANTHEON — All Olympus-616 gods in one container ─────────
  # Same image deployed to AWS ECS. All gods run via PM2.
  # Ports: Ares(3451), Hermes(3411), Athena(3401), Poseidon(3431),
  #        Apollo(3421), Proteus(3461), Zeus(3481), Plutus(3701),
  #        Mnemosyne(3711), Prometheus(3741), Control(615)
  pantheon:
    image: ghcr.io/olympus-616/pantheon:latest
    container_name: pantheon
    restart: unless-stopped
    ports:
      - "3401:3401"   # Athena (LLM gateway)
      - "3411:3411"   # Hermes (message routing)
      - "3421:3421"   # Apollo (TTS)
      - "3431:3431"   # Poseidon (MCP tools)
      - "3451:3451"   # Ares (API gateway)
      - "3461:3461"   # Proteus (data)
      - "3481:3481"   # Zeus (fleet controller)
      - "3701:3701"   # Plutus (metering)
      - "3711:3711"   # Mnemosyne (memory)
      - "3741:3741"   # Prometheus (jobs)
      - "615:615"     # Control plane
    env_file: .env
    environment:
      - NODE_ENV=production
      - ARES_API=http://localhost:3451
      - HERMES_API=http://localhost:3411
      - ATHENA_API=http://localhost:3401
      - POSEIDON_API=http://localhost:3431
      - MNEMOSYNE_URL=http://localhost:3711
      - PROTEUS_URL=http://localhost:3461
      - PLUTUS_URL=http://localhost:3701
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - MCP_SERVER_URL=http://localhost:3431/v1/poseidon/mcp/poc/mcp
    command: sh -c "env > /app/.env && exec pm2-runtime pm2.config.js"
    volumes:
      - turtleshell-data:/app/data
    networks:
      - olympus-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3451/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # ── TURTLESHELL OFF-GRID — Node Dashboard ──────────────────
  # Accessible at localhost:717
  turtleshell-offgrid:
    image: ghcr.io/cosmos-logos/turtleshell-offgrid:latest
    container_name: turtleshell-offgrid
    restart: unless-stopped
    ports:
      - "717:717"
      - "718:718"
    environment:
      - PORT=717
      - FLEET_HOST=pantheon
      - HTTPS_ENABLED=${HTTPS_ENABLED:-false}
      - NODE_PRIMARY_IP=${NODE_PRIMARY_IP:-localhost}
    volumes:
      - ${HOME:-.}/.turtleshell:/root/.turtleshell
      - ${HOME:-.}/turtleshell:/fleet
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - olympus-internal
    depends_on:
      pantheon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:717/health"]
      interval: 30s
      timeout: 10s
      retries: 3
