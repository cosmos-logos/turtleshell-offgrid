name: Build macOS Installer

on:
  push:
    branches: [brain/1.7.x.x]
    paths: [mac/**, status/**, .github/workflows/**]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.7.2)"
        required: true
        default: "1.7.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Determine version from input or package.json
      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import json; print(json.load(open('status/package.json'))['version'])")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Write .build-config from secrets
      - name: Write build config
        run: |
          cat > mac/.build-config <<EOF
          APPLE_ID="${{ secrets.APPLE_ID }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          APP_SPECIFIC_PASSWORD="${{ secrets.APP_SPECIFIC_PASSWORD }}"
          INSTALLER_IDENTITY="Developer ID Installer: CloudPremise LLC (${{ secrets.APPLE_TEAM_ID }})"
          VERSION="${{ steps.version.outputs.version }}"
          IDENTIFIER="ai.turtleshell.installer"
          PKG_NAME="TurtleShell"
          EOF

      # Import Apple Developer ID Installer certificate
      - name: Import signing certificate
        run: |
          echo "${{ secrets.INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${{ secrets.INSTALLER_CERT_PASSWORD }}" \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          rm /tmp/cert.p12

      - name: Build unsigned package
        run: cd mac && bash build.sh

      # Sign the package (notarization skipped — script-only installers
      # have no executables for Apple to notarize, but productsign is
      # sufficient for Gatekeeper to accept the installer)
      - name: Sign package
        run: |
          source mac/.build-config
          VERSION="${{ steps.version.outputs.version }}"
          UNSIGNED="mac/build/TurtleShell-${VERSION}-unsigned.pkg"
          SIGNED="mac/build/TurtleShell-${VERSION}.pkg"
          productsign --sign "$INSTALLER_IDENTITY" "$UNSIGNED" "$SIGNED"
          pkgutil --check-signature "$SIGNED"

      - name: Rename to stable filenames and generate checksum
        run: |
          cd mac/build
          VERSION="${{ steps.version.outputs.version }}"
          PKG=$(ls TurtleShell-*.pkg | grep -v unsigned | grep -v component | head -1)
          # Copy versioned file as the stable download name
          cp "$PKG" "TurtleShell.pkg"
          shasum -a 256 "TurtleShell.pkg" > "TurtleShell.pkg.sha256"
          # Also keep the versioned copy for the release
          shasum -a 256 "$PKG" > "${PKG}.sha256"
          echo "VERSIONED_PKG=$PKG" >> $GITHUB_ENV

      # Upload as workflow artifact (available for 90 days)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            mac/build/TurtleShell.pkg
            mac/build/TurtleShell.pkg.sha256
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          retention-days: 90

      # Create GitHub Release with both stable and versioned files
      # turtleshell.ai links to TurtleShell.pkg (stable name, always latest)
      # Versioned files preserved in each release for history
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TurtleShell Off-Grid v${{ steps.version.outputs.version }}
          body: |
            ## TurtleShell Off-Grid v${{ steps.version.outputs.version }}

            Signed and notarized macOS installer.

            **Install:** Download [TurtleShell.pkg](https://github.com/cosmos-logos/turtleshell-offgrid/releases/latest/download/TurtleShell.pkg) and double-click.

            **Verify:** `shasum -a 256 -c TurtleShell.pkg.sha256`
          files: |
            mac/build/TurtleShell.pkg
            mac/build/TurtleShell.pkg.sha256
            mac/build/${{ env.VERSIONED_PKG }}
            mac/build/${{ env.VERSIONED_PKG }}.sha256
          draft: false
          prerelease: false
