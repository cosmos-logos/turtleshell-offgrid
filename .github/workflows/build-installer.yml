name: Build macOS Installer

on:
  push:
    branches: [brain/1.7.x.x]
    paths: [mac/**, status/**]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.7.2)"
        required: true
        default: "1.7.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Determine version from input or package.json
      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import json; print(json.load(open('status/package.json'))['version'])")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      # Write .build-config from secrets
      - name: Write build config
        run: |
          cat > mac/.build-config <<EOF
          APPLE_ID="${{ secrets.APPLE_ID }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          APP_SPECIFIC_PASSWORD="${{ secrets.APP_SPECIFIC_PASSWORD }}"
          INSTALLER_IDENTITY="Developer ID Installer: CloudPremise LLC (${{ secrets.APPLE_TEAM_ID }})"
          VERSION="${{ steps.version.outputs.version }}"
          IDENTIFIER="ai.turtleshell.installer"
          PKG_NAME="TurtleShell"
          EOF

      # Import Apple Developer ID Installer certificate
      - name: Import signing certificate
        run: |
          echo "${{ secrets.INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${{ secrets.INSTALLER_CERT_PASSWORD }}" \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          rm /tmp/cert.p12

      - name: Build unsigned package
        run: cd mac && bash build.sh

      - name: Sign and notarize
        run: cd mac && bash sign.sh

      - name: Generate checksum
        run: |
          cd mac/build
          PKG=$(ls TurtleShell-*.pkg | grep -v unsigned | grep -v component | head -1)
          shasum -a 256 "$PKG" > "${PKG}.sha256"
          echo "PKG_FILE=$PKG" >> $GITHUB_ENV

      # Upload as workflow artifact (available for 90 days)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          retention-days: 90

      # Create GitHub Release with the signed .pkg attached
      # Download links on turtleshell.ai point to these release assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TurtleShell Off-Grid v${{ steps.version.outputs.version }}
          body: |
            ## TurtleShell Off-Grid v${{ steps.version.outputs.version }}

            Signed and notarized macOS installer.

            **Install:** Download `${{ env.PKG_FILE }}` and double-click to install.

            **Verify:** `shasum -a 256 -c ${{ env.PKG_FILE }}.sha256`
          files: |
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          draft: false
          prerelease: false
