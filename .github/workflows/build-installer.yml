name: Build & Deploy

on:
  push:
    branches: [brain/1.7.x.x]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.7.1)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  # ── Job 1: Docker image → ghcr.io/cosmos-logos/turtleshell-offgrid ──
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import json; print(json.load(open('status/package.json'))['version'])")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: status
          file: status/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cosmos-logos/turtleshell-offgrid:${{ steps.version.outputs.version }}
            ghcr.io/cosmos-logos/turtleshell-offgrid:latest

  # ── Job 2: macOS .pkg installer → GitHub Release ────────────────────
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(python3 -c "import json; print(json.load(open('status/package.json'))['version'])")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Write build config
        run: |
          cat > mac/.build-config <<EOF
          APPLE_ID="${{ secrets.APPLE_ID }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          APP_SPECIFIC_PASSWORD="${{ secrets.APP_SPECIFIC_PASSWORD }}"
          INSTALLER_IDENTITY="Developer ID Installer: CloudPremise LLC (${{ secrets.APPLE_TEAM_ID }})"
          VERSION="${{ steps.version.outputs.version }}"
          IDENTIFIER="ai.turtleshell.installer"
          PKG_NAME="TurtleShell"
          EOF

      - name: Import signing certificate
        run: |
          echo "${{ secrets.INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${{ secrets.INSTALLER_CERT_PASSWORD }}" \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          rm /tmp/cert.p12

      - name: Build unsigned package
        run: cd mac && bash build.sh

      - name: Sign package
        run: |
          source mac/.build-config
          VERSION="${{ steps.version.outputs.version }}"
          UNSIGNED="mac/build/TurtleShell-${VERSION}-unsigned.pkg"
          SIGNED="mac/build/TurtleShell-${VERSION}.pkg"
          productsign --sign "$INSTALLER_IDENTITY" "$UNSIGNED" "$SIGNED"
          pkgutil --check-signature "$SIGNED"

      - name: Rename to stable filenames and generate checksum
        run: |
          cd mac/build
          VERSION="${{ steps.version.outputs.version }}"
          PKG=$(ls TurtleShell-*.pkg | grep -v unsigned | grep -v component | head -1)
          cp "$PKG" "TurtleShell.pkg"
          shasum -a 256 "TurtleShell.pkg" > "TurtleShell.pkg.sha256"
          shasum -a 256 "$PKG" > "${PKG}.sha256"
          echo "VERSIONED_PKG=$PKG" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            mac/build/TurtleShell.pkg
            mac/build/TurtleShell.pkg.sha256
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TurtleShell Off-Grid v${{ steps.version.outputs.version }}
          body: |
            ## TurtleShell Off-Grid v${{ steps.version.outputs.version }}

            **Docker:** `docker pull ghcr.io/cosmos-logos/turtleshell-offgrid:${{ steps.version.outputs.version }}`

            **macOS Installer:** Download [TurtleShell.pkg](https://github.com/cosmos-logos/turtleshell-offgrid/releases/latest/download/TurtleShell.pkg) and double-click.

            **Verify:** `shasum -a 256 -c TurtleShell.pkg.sha256`
          files: |
            mac/build/TurtleShell.pkg
            mac/build/TurtleShell.pkg.sha256
            mac/build/${{ env.VERSIONED_PKG }}
            mac/build/${{ env.VERSIONED_PKG }}.sha256
          draft: false
          prerelease: false
