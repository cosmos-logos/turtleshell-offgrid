name: Build macOS Installer

on:
  push:
    branches: [brain/1.7.x.x]
    paths: [mac/**, status/**]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.7.3)"
        required: false
        default: "1.7.3"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Write .build-config from secrets
      - name: Write build config
        run: |
          VERSION="${{ github.event.inputs.version || '1.7.3' }}"
          cat > mac/.build-config <<EOF
          APPLE_ID="${{ secrets.APPLE_ID }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          APP_SPECIFIC_PASSWORD="${{ secrets.APP_SPECIFIC_PASSWORD }}"
          INSTALLER_IDENTITY="Developer ID Installer: CloudPremise LLC (${{ secrets.APPLE_TEAM_ID }})"
          VERSION="${VERSION}"
          IDENTIFIER="ai.turtleshell.installer"
          PKG_NAME="TurtleShell"
          EOF

      # Import Apple Developer ID Installer certificate
      - name: Import signing certificate
        run: |
          echo "${{ secrets.INSTALLER_CERT_P12 }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "ci" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "${{ secrets.INSTALLER_CERT_PASSWORD }}" \
            -T /usr/bin/productsign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci" build.keychain
          rm /tmp/cert.p12

      - name: Build unsigned package
        run: cd mac && bash build.sh

      - name: Sign and notarize
        run: cd mac && bash sign.sh

      - name: Generate checksum
        run: |
          cd mac/build
          PKG=$(ls TurtleShell-*.pkg | grep -v unsigned | grep -v component | head -1)
          shasum -a 256 "$PKG" > "${PKG}.sha256"
          echo "PKG_FILE=$PKG" >> $GITHUB_ENV
          echo "PKG_PATH=mac/build/$PKG" >> $GITHUB_ENV

      # Upload as workflow artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          retention-days: 90

      # Create GitHub Release
      - name: Create Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.7.3' }}
          name: TurtleShell Off-Grid v${{ github.event.inputs.version || '1.7.3' }}
          files: |
            mac/build/TurtleShell-*.pkg
            mac/build/TurtleShell-*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trigger turtleshell-web to redeploy (picks up new .pkg from release)
      - name: Trigger web deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/olympus-616/turtleshell-web/dispatches \
            -d '{"event_type":"installer-updated","client_payload":{"version":"${{ github.event.inputs.version || '1.7.3' }}"}}'
